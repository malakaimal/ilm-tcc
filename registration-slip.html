<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Retrieve and print your ILM registration slip.">
<title>Registration Slip | ILM The Contest Center</title>
<link rel="stylesheet" href="style.css">
<style>
.slip-paper{background:#fff;color:#172b46;border:1px solid #dbe3ee;border-radius:14px;padding:28px;max-width:760px;margin:24px auto;box-shadow:0 12px 34px rgba(12,35,64,.08)}
.slip-head{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:3px solid #d8b45d;padding-bottom:18px}
.slip-brand{font-weight:800;color:#102b55;font-size:22px}.slip-kicker{color:#9a7428;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.slip-id{background:#f3f6fa;border:1px solid #dbe3ee;padding:12px;border-radius:8px;font-weight:800}
.slip-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.slip-field{padding:11px;border-bottom:1px solid #e6ebf2}.slip-field small{display:block;color:#68778c;margin-bottom:4px}.slip-field strong{overflow-wrap:anywhere}
.slip-foot{border-top:1px solid #e6ebf2;padding-top:15px;color:#617087;font-size:13px}
@media(max-width:560px){.slip-grid{grid-template-columns:1fr}.slip-head{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff!important}.site-header,.site-footer,.page-hero,.lookup-card,.no-print{display:none!important}.slip-paper{box-shadow:none;border:1px solid #aaa;margin:0 auto;max-width:none}.section{padding:0!important}.container{max-width:none!important;padding:0!important}}
</style>
</head>
<body class="page-results">
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="container"><span class="eyebrow">ILM The Contest Center</span><h1>Download Registration Slip</h1><p>Retrieve your registration confirmation using your Application ID and registered email.</p></div></section>
<section class="section section-soft"><div class="container">
<div class="form-card lookup-card">
<div class="section-heading"><span class="tag">Student Services</span><h2>Find Your Registration Slip</h2><p>For privacy, both your Application ID and the email address used during registration are required.</p></div>
<form id="slipLookup">
<div class="field"><label for="applicationId">Application ID</label><input id="applicationId" required maxlength="50" placeholder="Example: ILM2026001" autocomplete="off"></div>
<div class="field"><label for="email">Registered Email Address</label><input id="email" type="email" required maxlength="180" placeholder="Enter the email used during registration" autocomplete="email"></div>
<button class="btn btn-blue" id="lookupButton" type="submit">Find My Slip</button>
</form>
<div id="slipMessage" class="form-message" role="status" aria-live="polite"></div>
</div>
<div id="slipOutput"></div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="script.js"></script>
<script>
const ILM_SLIP_API="https://script.google.com/macros/s/AKfycbwGvXpTiN2DBwio0NdnSqAgQBdG1SFV3ISkrFet-mO86UUPUXIyfC1AlmrOdxPGaviF/exec";
const form=document.getElementById("slipLookup"), message=document.getElementById("slipMessage"), output=document.getElementById("slipOutput"), button=document.getElementById("lookupButton");
function showMessage(t,type){message.textContent=t;message.className="form-message "+(type||"");message.style.display="block";}
function escapeText(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderSlip(s){
const fields=[["Student Name",s.studentName],["Father / Guardian",s.fatherName],["Date of Birth",s.dateOfBirth],["Class",s.className],["School",s.school],["Programme",s.programme],["Area",s.area],["Application Date",s.applicationDate],["Application Status",s.status]];
output.innerHTML='<article class="slip-paper" id="registrationSlip"><div class="slip-head"><div><div class="slip-kicker">Official Registration Confirmation</div><div class="slip-brand">ILM THE CONTEST CENTER</div><div>Shangla, Pakistan</div></div><div class="slip-id">Application ID<br>'+escapeText(s.applicationId)+'</div></div><div class="slip-grid">'+fields.map(f=>'<div class="slip-field"><small>'+escapeText(f[0])+'</small><strong>'+escapeText(f[1]||"Not provided")+'</strong></div>').join("")+'</div><div class="slip-foot">Keep this slip for your records. Application status and payment are subject to verification by ILM The Contest Center.<br>Contact: ilmthecontestcenter@gmail.com</div><div class="no-print" style="margin-top:20px"><button class="btn btn-blue" type="button" onclick="window.print()">Download / Print PDF</button></div></article>';
}
window.ilmRegistrationSlipCallback=function(data){button.disabled=false;button.textContent="Find My Slip";if(!data||!data.success){showMessage(data&&data.message?data.message:"Unable to retrieve this slip.","error");return;}showMessage("Registration found. Your slip is ready.","success");renderSlip(data.slip);};
form.addEventListener("submit",e=>{
e.preventDefault();output.replaceChildren();showMessage("Searching registration records...");button.disabled=true;button.textContent="Searching...";
const old=document.getElementById("ilmSlipLookupScript");if(old)old.remove();
const src=document.createElement("script");src.id="ilmSlipLookupScript";
src.onerror=()=>{button.disabled=false;button.textContent="Find My Slip";showMessage("Could not connect to the registration service. Please try again.","error");};
src.src=ILM_SLIP_API+"?action=registration-slip&applicationId="+encodeURIComponent(document.getElementById("applicationId").value.trim())+"&email="+encodeURIComponent(document.getElementById("email").value.trim())+"&prefix=ilmRegistrationSlipCallback";
document.body.appendChild(src);
});
</script>
</body></html>
